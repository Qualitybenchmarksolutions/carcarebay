<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarCareBay Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#111827}.app{display:flex;min-height:100vh}.side{width:240px;background:#111827;color:#fff;padding:24px 16px;position:fixed;inset:0 auto 0 0}.logo{font-size:22px;font-weight:800;padding:8px 12px 30px}.logo span{color:#60a5fa}.nav a{display:block;padding:12px;border-radius:10px;color:#cbd5e1;text-decoration:none;margin:4px 0;font-size:14px}.nav a.active,.nav a:hover{background:#1f2937;color:#fff}.main{margin-left:240px;width:calc(100% - 240px);padding:28px 32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.title{font-size:28px;font-weight:800}.sub{color:#6b7280;font-size:13px;margin-top:4px}.actions{display:flex;gap:10px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.white{background:#fff;border:1px solid #e5e7eb}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.kpi{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px}.kpi .label{color:#6b7280;font-size:12px}.kpi .value{font-size:28px;font-weight:800;margin-top:8px}.delta{font-size:12px;margin-top:7px;color:#16a34a}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px}.card h3{margin:0 0 16px;font-size:16px}.bars{height:210px;display:flex;align-items:flex-end;gap:14px;padding:15px 8px}.barwrap{flex:1;text-align:center;font-size:11px;color:#6b7280}.bar{background:#2563eb;border-radius:7px 7px 2px 2px;min-height:8px}.bar.alt{background:#93c5fd}.legend{display:flex;gap:18px;font-size:12px;color:#6b7280;margin-top:5px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2563eb;margin-right:5px}.dot.alt{background:#93c5fd}.tablecard{margin-top:18px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;color:#6b7280;font-weight:600;padding:11px 8px;border-bottom:1px solid #e5e7eb}.table td{padding:13px 8px;border-bottom:1px solid #f0f2f5}.pill{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}.green{background:#dcfce7;color:#15803d}.amber{background:#fef3c7;color:#a16207}.blue{background:#dbeafe;color:#1d4ed8}.red{background:#fee2e2;color:#b91c1c}.progress{height:7px;background:#eef2f7;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:#2563eb}.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}.miniBox{background:#f8fafc;border-radius:12px;padding:13px}.miniBox strong{display:block;font-size:20px}.muted{color:#6b7280;font-size:12px}.search{width:100%;padding:11px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:12px}.toast{position:fixed;right:25px;bottom:25px;background:#111827;color:#fff;padding:13px 16px;border-radius:10px;display:none}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center}.modalbox{background:#fff;width:min(650px,92vw);border-radius:18px;padding:24px}.modalbox h2{margin-top:0}.close{float:right;cursor:pointer}.filter{padding:9px;border:1px solid #e5e7eb;border-radius:9px;background:#fff}@media(max-width:900px){.side{width:72px}.logo{font-size:0}.logo:after{content:'CCB';font-size:17px}.nav a{font-size:0;text-align:center}.nav a:first-letter{font-size:18px}.main{margin-left:72px;width:calc(100% - 72px);padding:20px}.grid{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.main{padding:15px}.top{align-items:flex-start}.actions .white{display:none}.table{min-width:720px}.tablecard{overflow:auto}}
</style></head><body><div class="app"><aside class="side"><div class="logo">CarCare<span>Bay</span></div><nav class="nav"><a class="active" href="#" data-page="Overview">◉ &nbsp; Overview</a><a href="#" data-page="Customers">◯ &nbsp; Customers</a><a href="#" data-page="Apartments">⌂ &nbsp; Apartments</a><a href="#" data-page="Partners">♙ &nbsp; Partners</a><a href="#" data-page="Bookings">▣ &nbsp; Bookings</a><a href="#" data-page="Subscriptions">▤ &nbsp; Subscriptions</a><a href="#" data-page="Revenue">₹ &nbsp; Revenue</a><a href="#" data-page="Quality">✓ &nbsp; Quality</a></nav></aside><main class="main"><div class="top"><div><div class="title" id="pageTitle">Overview</div><div class="sub">Whitefield cluster · Monday, 21 September 2026</div></div><div class="actions"><button class="btn white" onclick="showModal('Export report')">Export</button><button class="btn primary" onclick="showModal('Add apartment')">+ Add apartment</button></div></div><div id="content"></div></main></div><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="modalbox"><span class="close" onclick="closeModal()">✕</span><h2 id="modalTitle">Action</h2><p class="muted">This is a prototype action. In production it will connect to the CarCareBay backend.</p><button class="btn primary" onclick="closeModal();toast('Action queued')">Continue</button></div></div><script>
const API_URL = localStorage.getItem('CCB_API_URL') || 'http://localhost:4000';
let cache={customers:[],apartments:[],partners:[],bookings:[],dashboard:null};
async function api(path,opts){const r=await fetch(API_URL+path,opts);if(!r.ok)throw new Error(await r.text());return r.json()}
async function refresh(){
  const [dashboard,customers,apartments,partners,bookings]=await Promise.all([
    api('/api/dashboard'),api('/api/customers'),api('/api/apartments'),api('/api/partners'),api('/api/bookings')]);
  cache={dashboard,customers,apartments,partners,bookings};
}
function money(v){return '₹'+(v>=100000?(v/100000).toFixed(2)+'L':(v/1000).toFixed(1)+'K')}
function overview(){const d=cache.dashboard||{};return `<div class="grid"><div class="kpi"><div class="label">Active subscribers</div><div class="value">${d.activeSubscribers??'—'}</div><div class="delta">Live from backend</div></div><div class="kpi"><div class="label">Monthly recurring revenue</div><div class="value">${d.mrr?money(d.mrr):'—'}</div><div class="delta">Live from backend</div></div><div class="kpi"><div class="label">Today's jobs</div><div class="value">${d.todaysJobs??'—'}</div><div class="delta">${d.completed??0} completed · live status</div></div><div class="kpi"><div class="label">Avg. customer rating</div><div class="value">${d.avgRating??'—'}/5</div><div class="delta">Backend metric</div></div></div><div class="layout"><div class="card"><h3>Revenue & subscribers</h3><div class="bars">${[55,62,70,78,74,88,96,105,112,120,132,145].map((x,i)=>`<div class="barwrap"><div class="bar" style="height:${x}px"></div><div>${['Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'][i]}</div></div>`).join('')}</div><div class="legend"><span><i class="dot"></i>MRR trend</span><span><i class="dot alt"></i>Subscriber growth</span></div></div><div class="card"><h3>Today's operations</h3><div class="mini"><div class="miniBox"><span class="muted">Completed</span><strong>${d.completed??0}</strong><span class="muted">backend</span></div><div class="miniBox"><span class="muted">In progress</span><strong>${cache.bookings.filter(x=>x.status==='In progress').length}</strong><span class="muted">live</span></div><div class="miniBox"><span class="muted">Pending</span><strong>${cache.bookings.filter(x=>x.status==='Scheduled').length}</strong><span class="muted">scheduled</span></div><div class="miniBox"><span class="muted">SLA met</span><strong>96%</strong><span class="muted">Target 95%</span></div></div><h3 style="margin-top:20px">Operator utilisation</h3>${cache.partners.slice(0,2).map(p=>`<div class="muted">${p.cluster} · ${p.utilisation}%</div><div class="progress"><i style="width:${p.utilisation}%"></i></div>`).join('')}</div></div><div class="card tablecard"><h3>Attention needed</h3><table class="table"><tr><th>Issue</th><th>Area</th><th>Impact</th><th>Status</th><th></th></tr>${(d.alerts||[]).map(a=>`<tr><td>${a.issue}</td><td>${a.area}</td><td>${a.impact}</td><td><span class="pill ${a.status==='At risk'?'red':'amber'}">${a.status}</span></td><td><button class="btn white" onclick="toast('Opened ${a.issue}')">Open</button></td></tr>`).join('')}</table></div>`}
function rowsFor(page){if(page==='Customers')return cache.customers.map(x=>[x.name,x.car,x.plate,x.bay,x.plan,x.status]);if(page==='Apartments')return cache.apartments.map(x=>[x.name,x.cars,x.subscribers,(x.subscribers/x.cars*100).toFixed(1)+'%',money(x.mrr),x.rating+'/5']);if(page==='Partners')return cache.partners.map(x=>[x.name,x.cluster,x.jobsToday,x.done,x.utilisation+'%',x.status]);if(page==='Bookings')return cache.bookings.map(x=>[x.id,x.customer,x.service,x.time,x.bay,x.status]);return []}
function tablePage(title,cols,rows){return `<div class="card"><input class="search" placeholder="Search ${title.toLowerCase()}..." oninput="filterTable(this)"><table class="table" id="mainTable"><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((v,i)=>`<td>${i===r.length-1?`<span class="pill ${v==='Active'||v==='Completed'||v==='Scheduled'?'green':v==='In progress'?'blue':v==='On leave'||v==='Paused'?'amber':'blue'}">${v}</span>`:v}</td>`).join('')}</tr>`).join('')}</table></div>`}
async function render(page){document.getElementById('pageTitle').textContent=page;document.getElementById('content').innerHTML='<div class="card"><p class="muted">Loading live data…</p></div>';try{await refresh();let c='';if(page==='Overview')c=overview();else if(['Customers','Apartments','Partners','Bookings'].includes(page)){const cols={Customers:['Customer','Car','Plate','Parking bay','Plan','Status'],Apartments:['Community','Cars','Subscribers','Penetration','MRR','Rating'],Partners:['Partner','Cluster','Jobs today','Done','Utilisation','Status'],Bookings:['Booking','Customer','Service','Time','Parking bay','Status']}[page];c=tablePage(page,cols,rowsFor(page));}else c=`<div class="card"><h3>${page}</h3><p class="muted">This module is connected to the shared backend scaffold and ready for its next workflow.</p><button class="btn primary" onclick="toast('${page} module opened')">Open module</button></div>`;document.getElementById('content').innerHTML=c}catch(e){document.getElementById('content').innerHTML=`<div class="card"><h3>Backend unavailable</h3><p class="muted">Could not reach ${API_URL}. Start the CarCareBay backend on port 4000, or set the API URL in localStorage.</p><button class="btn primary" onclick="render('${page}')">Retry</button></div>`}}
document.querySelectorAll('.nav a').forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelectorAll('.nav a').forEach(x=>x.classList.remove('active'));a.classList.add('active');render(a.dataset.page)});
function showModal(t){document.getElementById('modalTitle').textContent=t;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}function filterTable(input){let q=input.value.toLowerCase();document.querySelectorAll('#mainTable tr:not(:first-child)').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
render('Overview');
</script></body></html>
